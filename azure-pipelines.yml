pool:
  vmImage: 'windows-latest'

steps:
- task: AzureFileCopy@4
  inputs:
    SourcePath: $(build.sourcesDirectory)
    azureSubscription: 'Meta Corporativo(5ba1321c-f366-43a2-82bd-c06783138deb)'
    Destination: 'AzureBlob'
    storage: 'sitemetahomolog'
    ContainerName: 'https://sitemetahomolog.blob.core.windows.net/'
    BlobPrefix: '$web'